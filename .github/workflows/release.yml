name: Release

# Deploy is manual, not automatic on merge: pushing a tag is the explicit "ship this" action.
on:
  push:
    tags: ['v*.*.*']

env:
  IMAGE: ghcr.io/${{ github.repository }}

jobs:
  full-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'

      - uses: gradle/actions/setup-gradle@v4

      # Belt-and-suspenders: the executable bit is fixed in the git index (`git update-index
      # --chmod=+x gradlew`), but Windows checkouts have dropped it before and will again.
      - run: chmod +x gradlew

      # FFmpeg's own binary, needed for the @Tag("ffmpeg") classes fastTest skips (FfmpegRunnerTest,
      # MediaProbeTest, TranscodeServiceIntegrationTest). CLAUDE.md §10 calls AP4 the riskiest
      # package - a tag about to be deployed gets the full suite, not just the fast gate.
      - name: Install ffmpeg
        run: sudo apt-get update && sudo apt-get install -y ffmpeg

      - name: Run full test suite
        run: ./gradlew test --no-daemon

  build-and-push:
    needs: full-test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ env.IMAGE }}:${{ github.ref_name }}
            ${{ env.IMAGE }}:latest

  deploy:
    needs: build-and-push
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Plain OpenSSH, no marketplace SSH action - the deploy step handles the production
      # credential, keep it auditable rather than delegating it to a third-party action.
      - name: Configure SSH
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "${{ secrets.HETZNER_SSH_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          wc -l ~/.ssh/deploy_key
          ssh-keygen -y -f ~/.ssh/deploy_key || echo "KEY PARSE FAILED ON RUNNER"
          ssh-keyscan -H "${{ secrets.HETZNER_HOST }}" >> ~/.ssh/known_hosts

      # HETZNER_SSH_KEY is the "deploy" user's key. That user has no shell at all (forced
      # command, see infra/cloud-init.yaml.tpl + infra/deploy.sh) - it can only run rsync into
      # /opt/video-service/incoming or one of the two fixed "deploy ..." trigger phrases below,
      # never arbitrary shell (CLAUDE.md §11: a leaked deploy key can't delete the server; here
      # it additionally can't do anything on the server beyond these two actions either).
      - name: Upload compose + Caddy config
        run: |
          rsync -e "ssh -i ~/.ssh/deploy_key" compose.prod.yaml Caddyfile.prod deploy@"${{ secrets.HETZNER_HOST }}":./

      - name: Apply config and deploy image
        run: |
          ssh -i ~/.ssh/deploy_key deploy@"${{ secrets.HETZNER_HOST }}" "deploy files"
          ssh -i ~/.ssh/deploy_key deploy@"${{ secrets.HETZNER_HOST }}" "deploy backend ${{ github.ref_name }}"
