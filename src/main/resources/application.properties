spring.application.name=video-service

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

spring.flyway.locations=classpath:db/migration

management.endpoint.health.show-details=when-authorized

app.auth.issuer=video-service

app.storage.endpoint=http://localhost:9000
app.storage.region=us-east-1
app.storage.bucket=video-service
app.storage.access-key=videoservice
app.storage.secret-key=videoservice-dev
app.storage.path-style-access=true
app.storage.cors-allowed-origins=http://localhost:4200

app.upload.max-size-bytes=3145728000
app.upload.part-size-bytes=104857600
app.upload.part-url-ttl=PT3H
app.upload.session-ttl=P1D
