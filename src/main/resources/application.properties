spring.application.name=video-service

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

spring.flyway.locations=classpath:db/migration

# Every real controller hardcodes /api/... in its own @RequestMapping (no global context-path -
# see e.g. AuthController) to match Caddy's `@api path /api/*` reverse-proxy boundary
# (Caddyfile.prod) exactly. The actuator doesn't follow that convention by default - its base
# path is a separate Spring Boot property, not a controller mapping - so without this it silently
# falls outside Caddy's proxied prefix in production (Caddy forwards /api/actuator/health, but the
# actuator only listens on /actuator/health) and gets rejected by Spring Security's authenticated-
# by-default fallback (401) instead of ever reaching the actuator. Found 2026-08-30 checking the
# first live deploy.
management.endpoints.web.base-path=/api/actuator
management.endpoint.health.show-details=when-authorized
management.endpoints.web.exposure.include=health,info,prometheus

# Dev-only Basic-Auth credentials for /api/actuator/prometheus (SecurityConfig). Production
# overrides both via .env - see .env.example and infra/README.md.
app.actuator.metrics-username=prometheus
app.actuator.metrics-password=prometheus-dev-only

app.auth.issuer=video-service

app.api.cors-allowed-origins=http://localhost:4200

# Garage's S3 API (port 3900, see garage/garage.toml). Region must match garage.toml's
# s3_region exactly - Garage rejects a signature computed with any other region string
# (AuthorizationHeaderMalformed), unlike MinIO/AWS which don't care for a single-region setup.
app.storage.endpoint=http://localhost:3900
app.storage.region=garage
app.storage.bucket=video-service
# Fixed dev-only key, provisioned by the garage-init bootstrap in compose.yaml (Garage access
# keys must match its own ID/secret format, so - unlike MinIO - arbitrary strings don't work).
app.storage.access-key=GK001122334455667788990011
app.storage.secret-key=662c72327c27df3e03bbc9602abb627f6179e8c968350dfc578442cf398b1ff2
app.storage.path-style-access=true
app.storage.cors-allowed-origins=http://localhost:4200

app.upload.max-size-bytes=3145728000
app.upload.part-size-bytes=104857600
app.upload.part-url-ttl=PT3H
app.upload.session-ttl=P1D

app.delivery.segment-url-ttl=PT3H
app.delivery.playlist-cache-ttl=PT1M
app.delivery.playlist-cache-max-size=500

app.rate-limit.login.capacity=5
app.rate-limit.login.refill-period=PT15M
app.rate-limit.register.capacity=3
app.rate-limit.register.refill-period=PT1H
app.rate-limit.report.capacity=10
app.rate-limit.report.refill-period=PT1H
# Anonymous reports are only identifiable by IP (weaker identity than an account - NAT, VPN,
# IP rotation), so this bucket is deliberately stricter than the per-user one above.
app.rate-limit.report-anonymous.capacity=3
app.rate-limit.report-anonymous.refill-period=PT1H

# Real client IP behind Caddy (X-Forwarded-For) instead of the proxy IP - needed for rate limits
# and view-count dedup (AP7).
server.forward-headers-strategy=framework

app.view-count.dedup-window=P1D
