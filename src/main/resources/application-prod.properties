# Profile "prod": enable in production to disable OpenAPI/Swagger UI (CLAUDE.md section 10, AP5).
springdoc.api-docs.enabled=false
springdoc.swagger-ui.enabled=false

# Reuses STORAGE_PUBLIC_ORIGIN (.env) - the same value Caddyfile.prod already puts in the CSP
# header - instead of introducing a second env var that could drift out of sync with it.
app.storage.public-base-url=${STORAGE_PUBLIC_ORIGIN}
