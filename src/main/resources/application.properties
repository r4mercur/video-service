spring.application.name=video-service

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

spring.flyway.locations=classpath:db/migration

management.endpoint.health.show-details=when-authorized

app.auth.issuer=video-service

app.api.cors-allowed-origins=http://localhost:4200

app.storage.endpoint=http://localhost:9000
app.storage.region=us-east-1
app.storage.bucket=video-service
app.storage.access-key=videoservice
app.storage.secret-key=videoservice-dev
app.storage.path-style-access=true
app.storage.cors-allowed-origins=http://localhost:4200

app.upload.max-size-bytes=3145728000
app.upload.part-size-bytes=104857600
app.upload.part-url-ttl=PT3H
app.upload.session-ttl=P1D

app.delivery.segment-url-ttl=PT3H
app.delivery.playlist-cache-ttl=PT1M
app.delivery.playlist-cache-max-size=500

app.rate-limit.login.capacity=5
app.rate-limit.login.refill-period=PT15M
app.rate-limit.register.capacity=3
app.rate-limit.register.refill-period=PT1H
app.rate-limit.report.capacity=10
app.rate-limit.report.refill-period=PT1H

# Echte Client-IP hinter Caddy (X-Forwarded-For) statt der Proxy-IP - noetig fuer Rate-Limits
# und View-Count-Dedup (AP7).
server.forward-headers-strategy=framework

app.view-count.dedup-window=P1D
