services:
  postgres:
    image: 'postgres:17'
    environment:
      - 'POSTGRES_DB=mydatabase'
      - 'POSTGRES_PASSWORD=secret'
      - 'POSTGRES_USER=myuser'
    ports:
      - '5432:5432'
  minio:
    image: 'minio/minio:latest'
    command: 'server /data --console-address ":9002"'
    environment:
      - 'MINIO_ROOT_USER=videoservice'
      - 'MINIO_ROOT_PASSWORD=videoservice-dev'
      # MinIO does not support the S3 CORS API (PutBucketCors) - CORS must be set server-side.
      - 'MINIO_API_CORS_ALLOW_ORIGIN=http://localhost:4200'
    ports:
      - '9000:9000'
      - '9002:9002'
    volumes:
      - 'minio-data:/data'
  caddy:
    image: 'caddy:2'
    ports:
      - '80:80'
    volumes:
      - './Caddyfile:/etc/caddy/Caddyfile'
    environment:
      - 'STORAGE_BUCKET=video-service'
    extra_hosts:
      - 'host.docker.internal:host-gateway'
    depends_on:
      - minio

volumes:
  minio-data:
