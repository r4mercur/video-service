# Alert rules for the video-service scrape job (AP9, CLAUDE.md 10: "queue alerting").
# Shared between dev and prod - both compose files mount this next to their prometheus.yml.
#
# NOTE: there is deliberately no Alertmanager (yet) - firing alerts are visible in the
# Prometheus UI under /alerts and on the "Service Health" Grafana dashboard via the ALERTS
# metric, but nothing pages anyone. When a notification channel is wanted, add Alertmanager
# as its own compose service and wire `alerting:` in prometheus(.prod).yml - the rules here
# stay unchanged.

groups:
  - name: video-service
    rules:
      - alert: VideoServiceDown
        expr: up{job="video-service"} == 0
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: "video-service scrape target is down"
          description: "Prometheus has not been able to scrape the app for 2 minutes."

      # Based on the DB-backed gauge (JobQueueMetrics), so it works no matter which process is
      # scraped. 30 minutes overdue covers even a 2h-video transcode currently occupying the
      # single worker (CLAUDE.md 9.2: concurrency starts at 1) plus normal retry backoff -
      # sustained beyond that means the worker is stuck or dead.
      - alert: TranscodeQueueStalled
        expr: videoservice_jobs_oldest_pending_age_seconds > 1800
        for: 15m
        labels:
          severity: warning
        annotations:
          summary: "Transcode queue is not draining"
          description: "The oldest PENDING job has been overdue for {{ $value }}s. Worker stuck, dead, or overloaded?"

      # Only transient failures (S3/FFmpeg/infrastructure) - failed_validation is a user
      # uploading a broken file, which is expected and not an ops signal.
      - alert: JobTransientFailures
        expr: increase(videoservice_jobs_processed_total{outcome="failed_transient"}[1h]) > 2
        labels:
          severity: warning
        annotations:
          summary: "Jobs are failing with transient errors"
          description: "{{ $value }} transient job failures in the last hour (type {{ $labels.type }})."

      # CLAUDE.md 9.7: a DELETING video is already hidden, so nobody notices when its deletion
      # job gives up - but its renditions and source stay in storage, which a GDPR deletion
      # request doesn't allow. A deletion can wait behind a running 2h transcode and then retries
      # for ~2h, so 6h covers the worst legitimate case. Coarse on purpose: steady deletion
      # traffic could keep the gauge above zero, which at this platform's volume isn't a concern.
      - alert: VideoDeletionStuck
        expr: videoservice_videos{status="deleting"} > 0
        for: 6h
        labels:
          severity: warning
        annotations:
          summary: "Video deletions are not completing"
          description: "{{ $value }} video(s) have been DELETING for 6h. Check for FAILED VIDEO_DELETION jobs (last_error) - their storage objects are still present."

      - alert: HighHttp5xxRate
        expr: >
          sum(rate(http_server_requests_seconds_count{status=~"5.."}[5m]))
            / sum(rate(http_server_requests_seconds_count[5m])) > 0.05
          and sum(rate(http_server_requests_seconds_count[5m])) > 0.1
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "More than 5% of HTTP requests return 5xx"
          description: "5xx ratio has been above 5% for 5 minutes (with non-trivial traffic)."

      # --- Delivery (AP6/9.3) -------------------------------------------------------------
      # Segments are fetched by the browser straight from object storage, so HighHttp5xxRate
      # below cannot see them: during the September 2026 incident the origin was answering in
      # 6-11 s and returning the occasional 503 while every application-side metric stayed
      # green. These two rules are what make that visible without a user complaining.
      #
      # 4 s is the segment duration (HlsPackager -hls_time 4), i.e. the wall-clock budget to
      # fetch one segment while playing one. p95 at half that is already a video that stutters
      # for a meaningful share of viewers, which is why the threshold sits at 2 s rather than 4.
      - alert: MediaOriginSlow
        expr: >
          histogram_quantile(0.95,
            sum by (le) (rate(videoservice_delivery_origin_request_seconds_bucket[15m]))) > 2
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "Object storage origin is responding slowly"
          description: "p95 latency to the media origin is {{ $value }}s. Segments are 4s long - above ~2s, playback stalls for many viewers. Application metrics will look healthy regardless; check the storage provider."

      # Distinct from slowness: the origin is refusing or unreachable. Segments simply fail.
      - alert: MediaOriginFailing
        expr: >
          sum(rate(videoservice_delivery_origin_request_seconds_count{outcome!="ok"}[10m])) > 0
        for: 10m
        labels:
          severity: critical
        annotations:
          summary: "Media origin probe is failing"
          description: "The synthetic probe against the media origin has been failing (timeout, transport error or 5xx) for 10 minutes. Playback is likely broken for everyone."

      # Real viewers, from hls.js. Deliberately kept alongside the synthetic probe rather than
      # replacing it: if this fires while MediaOriginSlow stays quiet, the origin is fine and
      # the problem lies between it and the audience.
      - alert: ViewerPlaybackStalling
        expr: >
          histogram_quantile(0.95,
            sum by (le) (rate(videoservice_playback_fragment_load_seconds_bucket[15m]))) > 4
        for: 15m
        labels:
          severity: warning
        annotations:
          summary: "Viewers are waiting longer than one segment duration per segment"
          description: "p95 segment load time reported by players is {{ $value }}s against a 4s segment budget - buffers are draining faster than they fill."

      # Zero-tolerance: a single reuse means a refresh token was presented twice (CLAUDE.md 8
      # reuse detection) - replayed/stolen token or a badly broken client, either way worth a look.
      - alert: RefreshTokenReuseDetected
        expr: increase(videoservice_auth_refresh_reuse_total[15m]) > 0
        labels:
          severity: warning
        annotations:
          summary: "Refresh token reuse detected"
          description: "{{ $value }} reuse detections in the last 15 minutes - token theft or a misbehaving client."
