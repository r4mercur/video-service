plugins {
    id 'java'
    id 'org.springframework.boot' version '4.1.1'
    id 'io.spring.dependency-management' version '1.1.7'
    id 'org.gradle.test-retry' version '1.6.4'
}

group = 'com.bjarne'
version = '0.0.1-SNAPSHOT'
description = 'video-service'

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(25)
    }
}

repositories {
    mavenCentral()
}

dependencies {
    implementation 'org.springframework.boot:spring-boot-starter-actuator'
    implementation 'org.springframework.boot:spring-boot-starter-security'
    implementation 'org.springframework.boot:spring-boot-starter-security-oauth2-resource-server'
    implementation 'org.bouncycastle:bcprov-jdk18on:1.85.2'
    implementation 'org.springframework.boot:spring-boot-starter-webmvc'
    implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
    implementation 'org.springframework.boot:spring-boot-starter-flyway'
    implementation 'org.flywaydb:flyway-database-postgresql'
    implementation 'org.springframework.boot:spring-boot-starter-validation'
    implementation 'software.amazon.awssdk:s3:2.54.2'
    implementation 'com.github.ben-manes.caffeine:caffeine:3.1.8'
    implementation 'com.bucket4j:bucket4j-core:8.10.1'
    implementation 'org.springdoc:springdoc-openapi-starter-webmvc-ui:3.1.0'
    developmentOnly 'org.springframework.boot:spring-boot-devtools'
    developmentOnly 'org.springframework.boot:spring-boot-docker-compose'
    runtimeOnly 'io.micrometer:micrometer-registry-prometheus'
    runtimeOnly 'org.postgresql:postgresql'
    testImplementation 'org.springframework.boot:spring-boot-starter-actuator-test'
    testImplementation 'org.springframework.boot:spring-boot-starter-security-test'
    testImplementation 'org.springframework.boot:spring-boot-starter-webmvc-test'
    testImplementation 'org.springframework.boot:spring-boot-starter-data-jpa-test'
    testImplementation 'org.springframework.boot:spring-boot-testcontainers'
    testImplementation 'org.testcontainers:testcontainers-postgresql'
    testImplementation 'org.testcontainers:testcontainers-junit-jupiter'
    testImplementation 'org.testcontainers:testcontainers-minio'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

// Without these overrides, a stuck HikariCP waits out the full default timeout (30s) again on
// every single test before treating the connection as dead - with 9-10 tests per class, that
// turns a single Testcontainers hiccup into a 5-minute hang. A short timeout is plenty for tests
// (local test container, the connection should come up in milliseconds); a real hiccup should
// then make the class fail in seconds instead of minutes. Doesn't apply to production (the
// Spring default from application.properties stays unchanged there). Testcontainers Postgres
// occasionally loses its connection briefly on this environment (Docker Desktop/WSL2 networking
// symptom, cause deliberately not fixed - see the analysis). A test that fails once because of
// that and then passes cleanly on retry isn't a real bug - maxFailures caps that to a single
// outlier batch, so that a test that's actually broken (and fails on every retry too) still
// reliably turns the build red. 40 was enough for the suite up to AP6 (~72 tests) (already saw
// 20 failures in a single run); since AP7 (85 tests, several additional Testcontainers-heavy
// classes) the cap wasn't enough anymore on a bad batch - a full run summed across all retries
// was observed hitting up to ~55 failures before the plugin disables retry for the whole round
// (exactly when it's needed most). 100 instead of 40, with headroom.
tasks.withType(Test).configureEach {
    systemProperty 'spring.datasource.hikari.connection-timeout', '3000'
    systemProperty 'spring.datasource.hikari.validation-timeout', '3000'
    retry {
        maxRetries = 2
        maxFailures = 100
        failOnPassedAfterRetry = false
    }
}

tasks.named('test') {
    useJUnitPlatform()
}

// Faster CI gate task without the three FFmpeg-heavy classes (@Tag("ffmpeg")):
// FfmpegRunnerTest, MediaProbeTest, TranscodeServiceIntegrationTest. For the full run
// including the FFmpeg tests, keep using `test`.
tasks.register('fastTest', Test) {
    group = 'verification'
    description = 'Runs the test suite excluding @Tag("ffmpeg") tests (fast CI gate).'
    testClassesDirs = sourceSets.test.output.classesDirs
    classpath = sourceSets.test.runtimeClasspath
    useJUnitPlatform {
        excludeTags 'ffmpeg'
    }
}
