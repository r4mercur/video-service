global:
  scrape_interval: 15s

# No Alertmanager wired up - see the note at the top of alerts.yml.
rule_files:
  - /etc/prometheus/alerts.yml

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets: ['localhost:9090']

  # The video-service app runs on the host (docker-compose only holds infra), so it's
  # reached the same way Caddy reaches it (see Caddyfile) - via host.docker.internal.
  - job_name: video-service
    metrics_path: /api/actuator/prometheus
    # Matches application.properties' dev-only app.actuator.metrics-* defaults - production
    # uses a real secret via basic_auth.password_file instead, see prometheus.prod.yml.
    basic_auth:
      username: prometheus
      password: prometheus-dev-only
    static_configs:
      - targets: ['host.docker.internal:8080']
